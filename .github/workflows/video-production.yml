name: OpenMontage Video Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install OpenMontage
        run: make setup
      - name: Render free test videos
        run: make demo
      - name: Save videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-videos
          path: projects/demos/renders/*.mp4
          if-no-files-found: warn
          retention-days: 7
